<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: 'Fredoka', sans-serif;
         background: radial-gradient(circle at 26% 52%, #1E2A47 0%, #0F172A 62%); position: relative; }
  .glow { position: absolute; left: 75px; top: 70px; width: 360px; height: 360px; border-radius: 50%;
          background: radial-gradient(circle, rgba(247,160,114,0.30) 0%, rgba(247,160,114,0) 68%); }
  .nigiri { position: absolute; left: 10px; top: -14px; width: 490px; height: 500px;
            background: url(../../assets/icon/app_icon_foreground.png) center/contain no-repeat; }
  .text { position: absolute; left: 486px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0; color: #F8FAFC; font-weight: 600; font-size: 92px; line-height: 0.98; letter-spacing: -1px; }
  h1 span { color: #F7A072; }
  p { margin: 22px 0 0; color: #CBD5E1; font-weight: 500; font-size: 26px; }
  .dots { position: absolute; left: 0; right: 0; bottom: 34px; display: none; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="nigiri"></div>
  <div class="text">
    <h1>Sushi<br><span>Tracker</span></h1>
    <p id="tag">Count every piece, beat your record</p>
  </div>
  <script>
    const t = new URLSearchParams(location.search).get('tag');
    if (t) document.getElementById('tag').textContent = t;
  </script>
</body></html>
